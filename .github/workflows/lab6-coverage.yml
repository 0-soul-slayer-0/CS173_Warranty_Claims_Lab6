name: Lab 6 Coverage

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Lab 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install 'pytest>=8,<10' 'coverage==7.10.7'
      - name: Line coverage (100 percent required)
        run: |
          python -m coverage run --source=warranty_claims -m pytest -q CodeCoverageTest_warranty_claims_application.py
          python -m coverage report -m --fail-under=100
      - name: Branch coverage (100 percent required)
        run: |
          python -m coverage run --branch --source=warranty_claims -m pytest -q BranchCoverageTest_warranty_claims_application.py
          python -m coverage report -m --fail-under=100
      - name: All tests
        run: python -m pytest -q test_warranty_claims.py CodeCoverageTest_warranty_claims_application.py BranchCoverageTest_warranty_claims_application.py
